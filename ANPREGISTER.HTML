<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ANP - Register</title>
<style>
/* =========================================================
   RESET
========================================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html {
    width: 100%;
    min-height: 100%;
}
body {
    width: 100%;
    min-height: 100dvh;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    overflow-x: hidden;
}

/* =========================================================
   MAIN PAGE
========================================================= */
.page {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(0, 70, 20, .20), rgba(0, 150, 65, .18)), linear-gradient(135deg, #123b18 0%, #087b35 45%, #00a84f 100%);
}

.page::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 20% 10%, rgba(160,255,130,.35), transparent 30%), radial-gradient(circle at 85% 40%, rgba(0,255,150,.25), transparent 35%), radial-gradient(circle at 50% 100%, rgba(0,255,100,.20), transparent 40%);
}

.road {
    position: absolute;
    width: 160%;
    height: 50%;
    left: -30%;
    bottom: -10%;
    transform: rotate(-3deg);
    background: linear-gradient(165deg, transparent 30%, rgba(0,0,0,.16) 31%, rgba(0,0,0,.16) 65%, transparent 66%);
    opacity: .7;
    pointer-events: none;
}

.content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 650px;
    min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.brand {
    width: 100%;
    text-align: center;
    color: white;
    font-size: clamp(40px, 8vw, 80px);
    line-height: .9;
    font-weight: 900;
    letter-spacing: clamp(-3px, -0.5vw, -6px);
    margin-bottom: clamp(15px, 3vh, 30px);
    text-shadow: 0 4px 8px rgba(0,0,0,.25);
}

.form-title {
    color: white;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 1px;
}

.login-card {
    width: min(100%, 520px);
    padding: clamp(20px, 4vw, 38px);
    border-radius: clamp(15px, 2.5vw, 28px);
    background: rgba(130, 180, 135, .38);
    border: 1px solid rgba(255,255,255,.20);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.20);
}

.input-box {
    width: 100%;
    min-height: clamp(48px, 6vw, 56px);
    margin-bottom: clamp(12px, 2vw, 18px);
    display: flex;
    align-items: center;
    padding: 0 clamp(12px, 2vw, 18px);
    background: rgba(255,255,255,.95);
    border-radius: clamp(8px, 1.5vw, 13px);
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    transition: .25s ease;
}

.input-box:focus-within {
    transform: translateY(-1px);
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

.icon {
    flex: 0 0 28px;
    width: 28px;
    font-size: clamp(16px, 2vw, 20px);
    text-align: center;
    color: #43805b;
}

.input-box input {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: #333;
    font-size: clamp(13px, 1.5vw, 17px);
    padding-left: 10px;
}

.input-box input::placeholder {
    color: #aaa;
}

.eye {
    flex: 0 0 auto;
    cursor: pointer;
    color: #777;
    font-size: clamp(15px, 2vw, 19px);
    padding: 5px;
}

.option {
    width: 100%;
    display: flex;
    align-items: flex-start;
    color: rgba(255,255,255,.95);
    font-size: clamp(11px, 1.5vw, 15px);
    line-height: 1.5;
    margin: clamp(10px, 1.7vw, 17px) 0;
}

.option input {
    flex: 0 0 auto;
    appearance: none;
    width: clamp(16px, 2vw, 20px);
    height: clamp(16px, 2vw, 20px);
    margin-right: 9px;
    margin-top: 2px;
    border: 2px solid rgba(255,255,255,.55);
    border-radius: 50%;
    cursor: pointer;
}

.option input:checked {
    background: #24a95c;
    border-color: white;
    box-shadow: inset 0 0 0 4px white;
}

.option a {
    color: #18bde9;
    text-decoration: none;
    font-weight: 600;
}

.btn {
    width: 100%;
    min-height: clamp(48px, 6vw, 56px);
    border: none;
    border-radius: clamp(24px, 4vw, 32px);
    background: linear-gradient(180deg, #2da45a, #299653);
    color: white;
    font-size: clamp(14px, 1.8vw, 18px);
    font-weight: 600;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,.10);
    margin-top: 10px;
}

.btn:hover {
    background: linear-gradient(180deg, #35ad62, #238c4c);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,.16);
}

.btn:active {
    transform: scale(.98);
}

.divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 15px);
    margin: clamp(15px, 2.5vw, 23px) 0;
    color: white;
    font-size: clamp(12px, 1.5vw, 15px);
}

.divider span {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,.35);
}

.login-btn {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.5);
    margin-top: 0;
}

.login-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: white;
}
</style>
</head>

<body>
<div class="page">
    <div class="road"></div>
    <main class="content">
        <div class="brand">ANP</div>
        <div class="login-card">
            <div class="form-title">Create an Account</div>

            <!-- FULL NAME -->
            <div class="input-box">
                <div class="icon">👤</div>
                <input type="text" id="fullname" placeholder="Full Name" autocomplete="off">
            </div>

            <!-- EMAIL -->
            <div class="input-box">
                <div class="icon">✉️</div>
                <input type="email" id="email" inputmode="email" placeholder="Email Address" autocomplete="off">
            </div>

            <!-- PHONE -->
            <div class="input-box">
                <div class="icon">📱</div>
                <input type="tel" id="phone" inputmode="tel" placeholder="Phone Number" autocomplete="off">
            </div>

            <!-- PASSWORD -->
            <div class="input-box">
                <div class="icon">🔒</div>
                <input id="password" type="password" placeholder="Create Password" autocomplete="off">
                <div class="eye" onclick="togglePassword('password')" title="Show password">👁</div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="input-box">
                <div class="icon">🔒</div>
                <input id="confirm-password" type="password" placeholder="Confirm Password" autocomplete="off">
                <div class="eye" onclick="togglePassword('confirm-password')" title="Show password">👁</div>
            </div>

            <!-- TERMS -->
            <label class="option">
                <input type="checkbox">
                <span>I agree to the <a href="#" onclick="return false">Terms of Service</a> & <a href="#" onclick="return false">Privacy Policy</a></span>
            </label>

            <!-- REGISTER BUTTON -->
            <button class="btn" onclick="handleRegister()">
                Register Now
            </button>

            <div class="divider">
                <span></span>
                <div>Already have an account?</div>
                <span></span>
            </div>

            <!-- LOGIN LINK BUTTON -->
            <button class="btn login-btn" onclick="window.location.href='ANP.HTML'">
                Log In
            </button>
        </div>
    </main>
</div>

<script>
    function togglePassword(fieldId) {
        const pwdInput = document.getElementById(fieldId);
        pwdInput.type = pwdInput.type === "password" ? "text" : "password";
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
        authDomain: "anp-money.firebaseapp.com",
        projectId: "anp-money",
        storageBucket: "anp-money.firebasestorage.app",
        messagingSenderId: "581687927989",
        appId: "1:581687927989:web:41218431483f24a18b0afc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.handleRegister = async function() {
        const fullName = document.getElementById("fullname").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (!fullName || !email || !password) {
            alert("Please fill out all required fields.");
            return;
        }

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        try {
            // 1. Create user in Firebase Authentication
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // 2. Save profile data in Firestore Database[cite: 2]
            await setDoc(doc(db, "users", user.uid), {
                fullName: fullName,
                email: email,
                phone: phone,
                createdAt: new Date().toISOString()
            });

            alert("Registration successful!");
            window.location.href = "index.html"; 
        } catch (error) {
            alert("Error: " + error.message);
        }
    }
</script>
</body>
</html>
