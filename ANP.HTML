<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>ANP</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    width: 100%;
    min-height: 100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #000;

    overflow-x: hidden;
}


/* =========================================================
   MAIN PAGE
========================================================= */

.page {

    position: relative;

    width: 100%;
    min-height: 100dvh;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));

    background:
        linear-gradient(
            180deg,
            rgba(0, 70, 20, .20),
            rgba(0, 150, 65, .18)
        ),
        linear-gradient(
            135deg,
            #123b18 0%,
            #087b35 45%,
            #00a84f 100%
        );
}


/* =========================================================
   BACKGROUND LIGHT
========================================================= */

.page::before {

    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 20% 10%,
            rgba(160,255,130,.35),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 40%,
            rgba(0,255,150,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(0,255,100,.20),
            transparent 40%
        );
}


/* =========================================================
   DECORATIVE ROAD
========================================================= */

.road {

    position: absolute;

    width: 160%;
    height: 50%;

    left: -30%;
    bottom: -10%;

    transform: rotate(-3deg);

    background:
        linear-gradient(
            165deg,
            transparent 30%,
            rgba(0,0,0,.16) 31%,
            rgba(0,0,0,.16) 65%,
            transparent 66%
        );

    opacity: .7;

    pointer-events: none;
}


/* =========================================================
   CONTENT CONTAINER
========================================================= */

.content {

    position: relative;
    z-index: 2;

    width: 100%;

    max-width: 650px;

    min-height: calc(
        100dvh -
        env(safe-area-inset-top) -
        env(safe-area-inset-bottom)
    );

    display: flex;
    flex-direction: column;
    align-items: center;

    justify-content: center;
}


/* =========================================================
   ANP LOGO
========================================================= */

.brand {

    width: 100%;

    text-align: center;

    color: white;

    font-size:
        clamp(
            48px,
            10vw,
            110px
        );

    line-height: .9;

    font-weight: 900;

    letter-spacing:
        clamp(
            -5px,
            -0.7vw,
            -10px
        );

    margin-bottom:
        clamp(
            22px,
            4vh,
            45px
        );

    text-shadow:
        0 4px 8px rgba(0,0,0,.25);
}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-card {

    width: min(
        100%,
        520px
    );

    padding:
        clamp(20px, 4vw, 38px);

    border-radius:
        clamp(
            15px,
            2.5vw,
            28px
        );

    background:
        rgba(
            130,
            180,
            135,
            .38
        );

    border:
        1px solid
        rgba(255,255,255,.20);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:

        0 20px 60px
        rgba(0,0,0,.25),

        inset 0 1px 1px
        rgba(255,255,255,.20);
}


/* =========================================================
   INPUT
========================================================= */

.input-box {

    width: 100%;

    min-height:
        clamp(
            48px,
            6vw,
            62px
        );

    margin-bottom:
        clamp(
            12px,
            2vw,
            18px
        );

    display: flex;

    align-items: center;

    padding:
        0 clamp(
            12px,
            2vw,
            18px
        );

    background:
        rgba(255,255,255,.95);

    border-radius:
        clamp(
            8px,
            1.5vw,
            13px
        );

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.08);

    transition:
        .25s ease;
}


.input-box:focus-within {

    transform:
        translateY(-1px);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.15);
}


/* =========================================================
   INPUT ICON
========================================================= */

.icon {

    flex: 0 0 28px;

    width: 28px;

    font-size:
        clamp(
            16px,
            2vw,
            20px
        );

    text-align: center;

    color: #43805b;
}


/* =========================================================
   INPUT FIELD
========================================================= */

.input-box input {

    width: 100%;

    min-width: 0;

    border: none;

    outline: none;

    background: transparent;

    color: #333;

    font-size:
        clamp(
            13px,
            1.5vw,
            17px
        );

    padding-left: 10px;
}


.input-box input::placeholder {

    color: #aaa;
}


/* =========================================================
   PASSWORD EYE
========================================================= */

.eye {

    flex: 0 0 auto;

    cursor: pointer;

    color: #777;

    font-size:
        clamp(
            15px,
            2vw,
            19px
        );

    padding: 5px;
}


/* =========================================================
   OPTIONS
========================================================= */

.option {

    width: 100%;

    display: flex;

    align-items: flex-start;

    color:
        rgba(255,255,255,.95);

    font-size:
        clamp(
            11px,
            1.5vw,
            15px
        );

    line-height: 1.5;

    margin:
        clamp(
            10px,
            1.7vw,
            17px
        ) 0;
}


/* =========================================================
   CHECKBOX
========================================================= */

.option input {

    flex: 0 0 auto;

    appearance: none;

    width:
        clamp(
            16px,
            2vw,
            20px
        );

    height:
        clamp(
            16px,
            2vw,
            20px
        );

    margin-right: 9px;

    margin-top: 2px;

    border:
        2px solid
        rgba(255,255,255,.55);

    border-radius: 50%;

    cursor: pointer;
}


.option input:checked {

    background: #24a95c;

    border-color: white;

    box-shadow:
        inset 0 0 0 4px white;
}


/* =========================================================
   LINKS
========================================================= */

.option a {

    color: #18bde9;

    text-decoration: none;

    font-weight: 600;
}


/* =========================================================
   BUTTON
========================================================= */

.btn {

    width: 100%;

    min-height:
        clamp(
            48px,
            6vw,
            62px
        );

    border: none;

    border-radius:
        clamp(
            24px,
            4vw,
            32px
        );

    background:
        linear-gradient(
            180deg,
            #2da45a,
            #299653
        );

    color: white;

    font-size:
        clamp(
            14px,
            1.8vw,
            18px
        );

    font-weight: 600;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;

    box-shadow:
        0 6px 18px
        rgba(0,0,0,.10);
}


.btn:hover {

    background:
        linear-gradient(
            180deg,
            #35ad62,
            #238c4c
        );

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.16);
}


.btn:active {

    transform:
        scale(.98);
}


/* =========================================================
   DIVIDER
========================================================= */

.divider {

    width: 100%;

    display: flex;

    align-items: center;

    gap:
        clamp(
            8px,
            2vw,
            15px
        );

    margin:
        clamp(
            15px,
            2.5vw,
            23px
        ) 0;

    color: white;

    font-size:
        clamp(
            12px,
            1.5vw,
            15px
        );
}


.divider span {

    flex: 1;

    height: 1px;

    background:
        rgba(255,255,255,.35);
}


/* =========================================================
   REGISTER
========================================================= */

.register {

    background:
        linear-gradient(
            180deg,
            #2da45a,
            #299653
        );
}


/* =========================================================
   BOTTOM LOGO
========================================================= */

.bottom-logo {

    margin-top:
        clamp(
            25px,
            5vh,
            55px
        );

    color: white;

    font-size:
        clamp(
            30px,
            5vw,
            55px
        );

    opacity: .9;
}


/* =========================================================
   HELP BUTTON
========================================================= */

.help {

    position: fixed;

    right:
        max(
            18px,
            env(safe-area-inset-right)
        );

    bottom:
        max(
            18px,
            env(safe-area-inset-bottom)
        );

    width:
        clamp(
            38px,
            5vw,
            54px
        );

    height:
        clamp(
            38px,
            5vw,
            54px
        );

    border-radius: 50%;

    background:
        rgba(255,255,255,.95);

    display: flex;

    align-items: center;

    justify-content: center;

    color: #16874a;

    font-size:
        clamp(
            19px,
            2.5vw,
            27px
        );

    font-weight: bold;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.3);

    cursor: pointer;

    z-index: 20;

    transition:
        .2s ease;
}


.help:hover {

    transform:
        scale(1.08);
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .page {
        padding-left: 12px;
        padding-right: 12px;
    }

    .login-card {
        padding: 18px;
    }

    .brand {
        margin-bottom: 18px;
    }

}


/* =========================================================
   TABLETS
========================================================= */

@media (min-width: 600px) {

    .page {
        padding:
            30px;
    }

    .content {
        max-width: 600px;
    }

}


/* =========================================================
   LAPTOP / DESKTOP
========================================================= */

@media (min-width: 900px) {

    body {

        background:
            radial-gradient(
                circle at center,
                #222 0%,
                #080808 55%,
                #000 100%
            );

        display: flex;

        align-items: center;

        justify-content: center;
    }


    .page {

        width:
            min(
                100%,
                1200px
            );

        min-height:
            min(
                100dvh,
                1000px
            );

        border-radius: 25px;

        box-shadow:
            0 30px 100px
            rgba(0,0,0,.75);
    }


    .content {

        max-width: 620px;
    }

}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media (min-width: 1400px) {

    .page {

        max-width: 1400px;
    }

    .content {

        max-width: 680px;
    }

}


/* =========================================================
   TV / 4K / VERY LARGE SCREEN
========================================================= */

@media (min-width: 1920px) {

    .page {

        max-width: 1600px;

        border-radius: 35px;
    }

    .content {

        max-width: 750px;
    }

}


/* =========================================================
   LANDSCAPE PHONE / SMALL HEIGHT
========================================================= */

@media (
    max-height: 600px
) and (
    orientation: landscape
) {

    .page {

        padding-top: 10px;
        padding-bottom: 10px;
    }


    .content {

        justify-content:
            flex-start;

        padding-top: 10px;

        overflow-y: auto;
    }


    .brand {

        font-size: 45px;

        margin-bottom: 12px;
    }


    .login-card {

        padding: 15px;

        max-width: 500px;
    }


    .input-box {

        min-height: 42px;

        margin-bottom: 8px;
    }


    .option {

        margin: 7px 0;
    }


    .btn {

        min-height: 43px;
    }


    .divider {

        margin: 9px 0;
    }


    .bottom-logo {

        display: none;
    }

}


/* =========================================================
   VERY SHORT SCREENS
========================================================= */

@media (max-height: 450px) {

    .brand {
        font-size: 38px;
    }

    .login-card {
        padding: 12px;
    }

    .option {
        margin: 5px 0;
    }

}

</style>
</head>


<body>


<div class="page">

    <div class="road"></div>


    <main class="content">


        <!-- =========================================
             ANP BRAND
        ========================================== -->

        <div class="brand">
            ANP
        </div>


        <!-- =========================================
             LOGIN CARD
        ========================================== -->

        <div class="login-card">


            <!-- PHONE -->

            <div class="input-box">

                <div class="icon">
                    👤
                </div>

                <input
                    type="tel"
                    inputmode="tel"
                    placeholder="Please enter your phone number"
                    autocomplete="off"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-box">

                <div class="icon">
                    🔒
                </div>

                <input
                    id="password"
                    type="password"
                    placeholder="Please enter login password"
                    autocomplete="off"
                >

                <div
                    class="eye"
                    onclick="togglePassword()"
                    title="Show password">

                    👁

                </div>

            </div>


            <!-- REMEMBER -->

            <label class="option">

                <input
                    type="checkbox"
                >

                <span>
                    Remember username/password
                </span>

            </label>


            <!-- TERMS -->

            <label class="option">

                <input
                    type="checkbox"
                >

                <span>

                    Agree to our

                    <a
                        href="#"
                        onclick="return false">

                        privacy policy

                    </a>

                    &

                    <a
                        href="#"
                        onclick="return false">

                        server terms

                    </a>

                </span>

            </label>


            <!-- LOGIN -->

            <button
                class="btn"
                onclick="demoLogin()">

                Log in now

            </button>


            <!-- DIVIDER -->

            <div class="divider">

                <span></span>

                <div>or</div>

                <span></span>

            </div>


            <!-- REGISTER -->

            <button
                class="btn register"
                onclick="window.location.href='ANPREGISTER.HTML'">

                Register

            </button>


        </div>


        <!-- BOTTOM DECORATION -->

        <div class="bottom-logo">
            ◇
        </div>


    </main>


    <!-- HELP -->

    <div
        class="help"
        onclick="showHelp()">

        ?

    </div>


</div>


<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
        authDomain: "anp-money.firebaseapp.com",
        projectId: "anp-money",
        storageBucket: "anp-money.firebasestorage.app",
        messagingSenderId: "581687927989",
        appId: "1:581687927989:web:41218431483f24a18b0afc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleLogin = async function() {
        // Note: For login input, you can use email or map phone to email if using Email Auth
        const email = document.querySelector('input[type="tel"]').value; 
        const password = document.getElementById("password").value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "index.html";
        } catch (error) {
            alert("Login failed: " + error.message);
        }
    }
</script>


</body>
</html>
