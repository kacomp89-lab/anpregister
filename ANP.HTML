<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ANP</title>
<style>
/* =========================================================
   RESET
========================================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html {
    width: 100%;
    min-height: 100%;
}
body {
    width: 100%;
    min-height: 100dvh;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    overflow-x: hidden;
}

/* =========================================================
   MAIN PAGE
========================================================= */
.page {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(0, 70, 20, .20), rgba(0, 150, 65, .18)), linear-gradient(135deg, #123b18 0%, #087b35 45%, #00a84f 100%);
}

/* =========================================================
   BACKGROUND LIGHT
========================================================= */
.page::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 20% 10%, rgba(160,255,130,.35), transparent 30%), radial-gradient(circle at 85% 40%, rgba(0,255,150,.25), transparent 35%), radial-gradient(circle at 50% 100%, rgba(0,255,100,.20), transparent 40%);
}

/* =========================================================
   DECORATIVE ROAD
========================================================= */
.road {
    position: absolute;
    width: 160%;
    height: 50%;
    left: -30%;
    bottom: -10%;
    transform: rotate(-3deg);
    background: linear-gradient(165deg, transparent 30%, rgba(0,0,0,.16) 31%, rgba(0,0,0,.16) 65%, transparent 66%);
    opacity: .7;
    pointer-events: none;
}

/* =========================================================
   CONTENT CONTAINER
========================================================= */
.content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 650px;
    min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* =========================================================
   ANP LOGO
========================================================= */
.brand {
    width: 100%;
    text-align: center;
    color: white;
    font-size: clamp(48px, 10vw, 110px);
    line-height: .9;
    font-weight: 900;
    letter-spacing: clamp(-5px, -0.7vw, -10px);
    margin-bottom: clamp(22px, 4vh, 45px);
    text-shadow: 0 4px 8px rgba(0,0,0,.25);
}

/* =========================================================
   LOGIN CARD
========================================================= */
.login-card {
    width: min(100%, 520px);
    padding: clamp(20px, 4vw, 38px);
    border-radius: clamp(15px, 2.5vw, 28px);
    background: rgba(130, 180, 135, .38);
    border: 1px solid rgba(255,255,255,.20);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.20);
}

/* =========================================================
   INPUT
========================================================= */
.input-box {
    width: 100%;
    min-height: clamp(48px, 6vw, 62px);
    margin-bottom: clamp(12px, 2vw, 18px);
    display: flex;
    align-items: center;
    padding: 0 clamp(12px, 2vw, 18px);
    background: rgba(255,255,255,.95);
    border-radius: clamp(8px, 1.5vw, 13px);
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    transition: .25s ease;
}
.input-box:focus-within {
    transform: translateY(-1px);
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}
.icon {
    flex: 0 0 28px;
    width: 28px;
    font-size: clamp(16px, 2vw, 20px);
    text-align: center;
    color: #43805b;
}
.input-box input {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: #333;
    font-size: clamp(13px, 1.5vw, 17px);
    padding-left: 10px;
}
.input-box input::placeholder {
    color: #aaa;
}
.eye {
    flex: 0 0 auto;
    cursor: pointer;
    color: #777;
    font-size: clamp(15px, 2vw, 19px);
    padding: 5px;
}

/* =========================================================
   OPTIONS
========================================================= */
.option {
    width: 100%;
    display: flex;
    align-items: flex-start;
    color: rgba(255,255,255,.95);
    font-size: clamp(11px, 1.5vw, 15px);
    line-height: 1.5;
    margin: clamp(10px, 1.7vw, 17px) 0;
}
.option input {
    flex: 0 0 auto;
    appearance: none;
    width: clamp(16px, 2vw, 20px);
    height: clamp(16px, 2vw, 20px);
    margin-right: 9px;
    margin-top: 2px;
    border: 2px solid rgba(255,255,255,.55);
    border-radius: 50%;
    cursor: pointer;
}
.option input:checked {
    background: #24a95c;
    border-color: white;
    box-shadow: inset 0 0 0 4px white;
}
.option a {
    color: #18bde9;
    text-decoration: none;
    font-weight: 600;
}

/* =========================================================
   BUTTON
========================================================= */
.btn {
    width: 100%;
    min-height: clamp(48px, 6vw, 62px);
    border: none;
    border-radius: clamp(24px, 4vw, 32px);
    background: linear-gradient(180deg, #2da45a, #299653);
    color: white;
    font-size: clamp(14px, 1.8vw, 18px);
    font-weight: 600;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,.10);
}
.btn:hover {
    background: linear-gradient(180deg, #35ad62, #238c4c);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,.16);
}
.btn:active {
    transform: scale(.98);
}

/* =========================================================
   DIVIDER
========================================================= */
.divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 15px);
    margin: clamp(15px, 2.5vw, 23px) 0;
    color: white;
    font-size: clamp(12px, 1.5vw, 15px);
}
.divider span {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,.35);
}

.register {
    background: linear-gradient(180deg, #2da45a, #299653);
}

.bottom-logo {
    margin-top: clamp(25px, 5vh, 55px);
    color: white;
    font-size: clamp(30px, 5vw, 55px);
    opacity: .9;
}
</style>
</head>

<body>
<div class="page">
    <div class="road"></div>
    <main class="content">
        <div class="brand">ANP</div>
        <div class="login-card">

            <!-- EMAIL INPUT -->
            <div class="input-box">
                <div class="icon">✉️</div>
                <input 
                    type="email" 
                    id="email"
                    inputmode="email"
                    placeholder="Please enter your email address"
                    autocomplete="off"
                >
            </div>

            <!-- PASSWORD -->
            <div class="input-box">
                <div class="icon">🔒</div>
                <input 
                    id="password"
                    type="password"
                    placeholder="Please enter login password"
                    autocomplete="off"
                >
                <div class="eye" onclick="togglePassword()" title="Show password">👁</div>
            </div>

            <!-- REMEMBER -->
            <label class="option">
                <input type="checkbox">
                <span>Remember username/password</span>
            </label>

            <!-- TERMS -->
            <label class="option">
                <input type="checkbox">
                <span>Agree to our <a href="#" onclick="return false">privacy policy</a> & <a href="#" onclick="return false">server terms</a></span>
            </label>

            <!-- LOGIN BUTTON -->
            <button class="btn" onclick="handleLogin()">
                Log in now
            </button>

            <div class="divider">
                <span></span>
                <div>or</div>
                <span></span>
            </div>

            <!-- REGISTER -->
            <button class="btn register" onclick="window.location.href='ANPREGISTER.HTML'">
                Register
            </button>
        </div>

        <div class="bottom-logo">◇</div>
    </main>
</div>

<script>
    function togglePassword() {
        const pwdInput = document.getElementById("password");
        pwdInput.type = pwdInput.type === "password" ? "text" : "password";
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
        authDomain: "anp-money.firebaseapp.com",
        projectId: "anp-money",
        storageBucket: "anp-money.firebasestorage.app",
        messagingSenderId: "581687927989",
        appId: "1:581687927989:web:41218431483f24a18b0afc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleLogin = async function() {
        const email = document.getElementById("email").value; 
        const password = document.getElementById("password").value;

        if (!email || !password) {
            alert("Please fill in both email and password.");
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
            alert("Login successful!");
            window.location.href = "index.html"; // Redirect to your target page after login
        } catch (error) {
            alert("Login failed: " + error.message);
        }
    }
</script>
</body>
</html>
